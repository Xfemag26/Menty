[package]
name = "momentum"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "momentum"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "x11", "glow"] }
egui = "0.29"
sysinfo = "0.32"
scraper = "0.21"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
urlencoding = "2"
anyhow = "1"
libc = "0.2"
regex = { version = "1.10", default-features = false, features = ["std", "perf", "unicode-case"] }
infer-rs = { path = "../infer-rs" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

